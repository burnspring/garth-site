<!doctype html><html><body style="margin:0;background:#000"><canvas id="c" width="1920" height="1080"></canvas>
<script>
// Plays the captured frames against the narration in real time and records both.
window.run = async () => {
  const m = await (await fetch("manifest.json")).json();
  const ac = new AudioContext({ sampleRate: 48000 });
  const bufs = {};
  for (const s of m.scenes) bufs[s.id] = await ac.decodeAudioData(await (await fetch(`audio/${s.id}.mp3`)).arrayBuffer());
  const cv = document.getElementById("c"), g = cv.getContext("2d");
  const imgs = new Map();
  const load = (i) => { if (i >= m.frames.length || imgs.has(i)) return; const im = new Image(); im.src = "frames/" + m.frames[i].f; imgs.set(i, im.decode().then(() => im)); };
  for (let i = 0; i < 40; i++) load(i);
  await imgs.get(0);
  const dest = ac.createMediaStreamDestination();
  const vs = cv.captureStream(30);
  const stream = new MediaStream([...vs.getVideoTracks(), ...dest.stream.getAudioTracks()]);
  const kinds = { webm: "video/webm;codecs=vp8,opus" };
  const recs = {}, chunks = {};
  for (const [k, t] of Object.entries(kinds)) {
    chunks[k] = [];
    recs[k] = new MediaRecorder(stream, { mimeType: t, videoBitsPerSecond: 5_000_000, audioBitsPerSecond: 128000 });
    recs[k].ondataavailable = (e) => e.data.size && chunks[k].push(e.data);
  }
  // Fade between scenes: remember the outgoing picture.
  const prev = document.createElement("canvas"); prev.width = 1920; prev.height = 1080; const pg = prev.getContext("2d");
  const sceneAt = (t) => { let k = 0; m.scenes.forEach((s, i) => { if (t >= s.start) k = i; }); return k; };
  Object.values(recs).forEach((r) => r.start(1000));
  const t0 = ac.currentTime + 0.3;
  for (const s of m.scenes) { const src = ac.createBufferSource(); src.buffer = bufs[s.id]; src.connect(dest); src.start(t0 + s.start + s.lead); }
  let fi = 0, drawnScene = -1, cur = null;
  await new Promise((done) => {
    const tick = async () => {
      const t = ac.currentTime - t0;
      if (t >= m.total) { clearInterval(iv); done(); return; }
      if (t < 0) return;
      while (fi + 1 < m.frames.length && m.frames[fi + 1].t <= t) fi++;
      for (let i = fi; i < fi + 40; i++) load(i);
      for (const k of imgs.keys()) if (k < fi - 2) imgs.delete(k);
      const im = await imgs.get(fi);
      const sc = sceneAt(t);
      if (sc !== drawnScene) { if (cur) pg.drawImage(cv, 0, 0); drawnScene = sc; }
      g.drawImage(im, 0, 0, 1920, 1080); cur = im;
      const since = t - m.scenes[sc].start;
      if (sc > 0 && since < 0.45) { g.globalAlpha = 1 - since / 0.45; g.drawImage(prev, 0, 0); g.globalAlpha = 1; }
    };
    const iv = setInterval(tick, 1000 / 30);
  });
  await new Promise((r) => setTimeout(r, 400));
  const out = {};
  for (const [k, r] of Object.entries(recs)) { await new Promise((ok) => { r.onstop = ok; r.stop(); }); out[k] = new Blob(chunks[k], { type: kinds[k] }); }
  window.outB64 = {};
  for (const [k, b] of Object.entries(out)) {
    const u8 = new Uint8Array(await b.arrayBuffer()); let s = ""; for (let i = 0; i < u8.length; i += 0x8000) s += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000));
    window.outB64[k] = btoa(s);
  }
  return Object.fromEntries(Object.entries(window.outB64).map(([k, v]) => [k, v.length]));
};
</script></body></html>
